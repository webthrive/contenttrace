<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<style>
  .tbl { position: absolute; left: 56px; right: 56px; top: 96px; }
  .r { display: grid; grid-template-columns: 290px 70px 1fr; align-items: center; height: 100px; border-bottom: 1.5px solid var(--night-3); }
  .r:last-child { border-bottom: 0; }
  .sec { font-family: "JB", monospace; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
  .arrow { font-size: 26px; color: var(--muted); text-align: center; }
  .fix { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
</style></head>
<body>
<div id="canvas" class="inline light">
  <div class="glow" style="right:-360px;top:-380px;opacity:.8"></div>
  <div class="label" style="position:absolute;left:56px;top:44px">What Google rewards → the edit that delivers it</div>
  <div class="tbl">
    <div class="r"><div class="sec">Experience</div><div class="arrow">→</div><div class="fix">Add one <span class="grad-text">first-hand detail</span></div></div>
    <div class="r"><div class="sec">Expertise</div><div class="arrow">→</div><div class="fix">A real byline and author page</div></div>
    <div class="r"><div class="sec">Trust</div><div class="arrow">→</div><div class="fix">Named sources, every claim <span class="grad-text">fact-checked</span></div></div>
    <div class="r"><div class="sec">People-first</div><div class="arrow">→</div><div class="fix">A clear reader, answer up top</div></div>
  </div>
</div>
</body></html>
