<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<style>
  .list { position: absolute; left: 56px; top: 100px; width: 520px; display: flex; flex-direction: column; gap: 16px; }
  .card { height: 82px; padding: 0 22px; display: flex; align-items: center; gap: 16px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .x { font-family: "JB", monospace; font-size: 22px; color: var(--coral); width: 22px; }
  .arrow { position: absolute; left: 600px; top: 250px; font-size: 44px; color: var(--muted); }
  .res { display: block !important; position: absolute; left: 660px; top: 170px; width: 284px; height: 230px; padding: 26px 24px; }
  .res .label { margin-bottom: 14px; }
  .res .t { font-size: 34px; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; }
</style></head>
<body>
<div id="canvas" class="inline light">
  <div class="glow" style="right:-360px;top:-380px;opacity:.8"></div>
  <div class="label" style="position:absolute;left:56px;top:44px">Missing from a raw AI draft</div>
  <div class="list">
    <div class="card"><span class="x">×</span>A hedge earned by real doubt</div>
    <div class="card"><span class="x">×</span>An opinion that shifts mid-way</div>
    <div class="card"><span class="x">×</span>A specific that really happened</div>
    <div class="card"><span class="x">×</span>Rhythm that follows the meaning</div>
  </div>
  <div class="arrow">→</div>
  <div class="card res"><div class="label">Reader result</div><div class="t">Read faster. <span style="color:var(--coral)">Remember less.</span></div></div>
</div>
</body></html>
