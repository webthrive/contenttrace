<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<style>
  .tbl { position: absolute; left: 56px; right: 56px; top: 98px; }
  .r { display: grid; grid-template-columns: 320px 60px 1fr; align-items: center; height: 96px; border-bottom: 1.5px solid var(--night-3); }
  .r:last-child { border-bottom: 0; }
  .sec { font-family: "JB", monospace; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
  .low { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .track { width: 190px; height: 10px; border-radius: 5px; background: var(--night-3); overflow: hidden; }
  .fill { height: 100%; background: var(--coral); border-radius: 5px; }
  .low span { font-family: "JB", monospace; font-size: 12px; color: var(--coral); letter-spacing: 0.1em; }
  .arrow { font-size: 26px; color: var(--muted); text-align: center; }
  .fix { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
</style></head>
<body>
<div id="canvas" class="inline light">
  <div class="glow" style="left:-360px;bottom:-420px;opacity:.8"></div>
  <div class="label" style="position:absolute;left:56px;top:44px">Low section → the edit that moves it</div>
  <div class="tbl">
    <div class="r"><div><div class="sec">Voice &amp; perspective</div><div class="low"><div class="track"><div class="fill" style="width:26%"></div></div><span>Low</span></div></div><div class="arrow">→</div><div class="fix">Take a position someone could dispute</div></div>
    <div class="r"><div><div class="sec">Content &amp; logic</div><div class="low"><div class="track"><div class="fill" style="width:30%"></div></div><span>Low</span></div></div><div class="arrow">→</div><div class="fix">Add a real example or sourced number</div></div>
    <div class="r"><div><div class="sec">Cognitive fingerprinting</div><div class="low"><div class="track"><div class="fill" style="width:24%"></div></div><span>Low</span></div></div><div class="arrow">→</div><div class="fix">Show the reasoning, including one doubt</div></div>
    <div class="r"><div><div class="sec">Word choice &amp; phrasing</div><div class="low"><div class="track"><div class="fill" style="width:32%"></div></div><span>Low</span></div></div><div class="arrow">→</div><div class="fix">Cut filler and hedges, then rescore</div></div>
  </div>
</div>
</body></html>
