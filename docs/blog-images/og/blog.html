<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<style>
  .og { width: 1200px; height: 630px; }
  .og .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 540px; display: flex; flex-direction: column; justify-content: center; }
  .og h1 { font-weight: 800; font-size: 76px; line-height: 0.98; letter-spacing: -0.035em; margin: 22px 0 28px; }
  .list { position: absolute; left: 700px; top: 105px; width: 440px; font-family: "JB", monospace; font-size: 19px; line-height: 2.3; color: var(--dim); }
  .list .on { color: var(--ink-2); }
  .list .n { display: inline-block; width: 44px; }
  .list .on .n { color: var(--coral); }
  .plans { position: absolute; left: 680px; top: 120px; width: 450px; display: flex; flex-direction: column; gap: 16px; }
  .plan { background: var(--night-2); border: 1.5px solid var(--night-3); border-radius: 16px; padding: 18px 22px; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .plan.best { border-color: #9b4dff; }
  .plan .name { font-family: "JB", monospace; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .plan .price { font-weight: 800; font-size: 34px; letter-spacing: -0.02em; }
  .plan .sub { font-family: "JB", monospace; font-size: 14px; color: var(--ink-2); margin-top: 4px; text-align: right; }
</style></head>
<body>
<div id="canvas" class="og">
  <div class="glow" style="right:-200px;top:-180px"></div>
  <svg class="trace" data-seed="blog" width="1200" height="80" style="bottom:10px"></svg>
  <div class="left">
    <div class="k">The ContentTrace blog</div>
    <h1>Notes on writing that reads <span class="grad-text">human.</span></h1>
    <div class="foot"><img src="../logo.svg" alt="">/ blog</div>
  </div>
  <div class="list">
    <div class="on"><span class="n">01</span>How a draft gets read</div>
    <div class="on"><span class="n">02</span>How to humanize AI content</div>
    <div><span class="n">03</span>The specificity test</div>
    <div><span class="n">04</span>AI detection and SEO</div>
    <div><span class="n">05</span>How we calibrate scores</div>
    <div><span class="n">06</span>Can detectors be fooled?</div>
    <div><span class="n">07</span>Editor, not author</div>
  </div>
</div>
<script src="../trace.js"></script>
</body></html>
