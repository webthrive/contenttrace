<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<style>
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-size: 58px; line-height: 1.06; font-weight: 700; letter-spacing: -0.025em; margin: 26px 0 26px; }
  h1 em { font-style: normal; color: var(--teal); }
  .foot { font-size: 14px; color: var(--muted); }
  .doc { left: 600px; top: 76px; width: 528px; height: 523px; padding: 34px 36px; }
  .doc .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; font-size: 13px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
  .cut { position: relative; height: 22px; border-radius: 5px; background: var(--red-bg); border: 1.5px dashed rgba(196,51,2,0.45); }
  .cut::after { content: ""; position: absolute; left: 8px; right: 8px; top: 50%; height: 2px; background: var(--red); }
  .add { height: 22px; border-radius: 5px; background: var(--teal-bg); border: 1.5px solid rgba(10,115,115,0.4); }
  .lbl { font-size: 11px; padding: 3px 7px; border-radius: 5px; white-space: nowrap; }
  .lbl.r { color: var(--red); background: var(--red-bg); }
  .lbl.t { color: var(--teal); background: var(--teal-bg); }
  .caret { width: 3px; height: 26px; background: var(--teal); border-radius: 2px; }
  .meter { position: absolute; left: 36px; right: 36px; bottom: 32px; padding-top: 22px; border-top: 1.5px solid var(--border-light); }
  .m { display: flex; align-items: center; gap: 14px; margin-top: 10px; font-size: 12px; }
  .m .k { width: 66px; color: var(--muted); }
  .track { flex: 1; height: 12px; border-radius: 6px; background: var(--border-light); overflow: hidden; }
  .fill { height: 100%; border-radius: 6px; }
</style></head>
<body>
<div id="canvas" class="hero">
  <div class="grid-bg"></div>
  <div class="left">
    <div><span class="tag teal mono">Guide · 6 passes</span></div>
    <h1>Six passes from draft to <em>human</em></h1>
    <div class="foot mono">ContentTrace blog</div>
  </div>

  <div class="panel doc">
    <div class="hdr mono"><span>draft.txt</span><span>Editing pass 1 → 6</span></div>
    <div class="row"><div class="line" style="width:92%"></div></div>
    <div class="row"><div class="cut" style="width:62%"></div><span class="lbl r mono">Filler</span></div>
    <div class="row"><div class="line" style="width:78%"></div></div>
    <div class="row"><div class="line" style="width:40%"></div><div class="line" style="width:22%"></div></div>
    <div class="row"><div class="caret"></div><div class="add" style="width:58%"></div><span class="lbl t mono">Real example</span></div>
    <div class="row"><div class="line" style="width:86%"></div></div>
    <div class="row"><div class="cut" style="width:46%"></div><span class="lbl r mono">Hedge</span></div>
    <div class="row"><div class="caret"></div><div class="add" style="width:70%"></div><span class="lbl t mono">Position</span></div>
    <div class="meter mono">
      <div class="m"><span class="k">Draft</span><div class="track"><div class="fill" style="width:24%;background:var(--red)"></div></div></div>
      <div class="m"><span class="k">Edited</span><div class="track"><div class="fill" style="width:84%;background:var(--teal)"></div></div></div>
    </div>
  </div>
</div>
</body></html>
